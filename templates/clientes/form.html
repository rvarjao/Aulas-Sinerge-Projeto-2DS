{% extends "base.html" %}
{% block title %}{{ 'Editar' if cliente else 'Novo' }} cliente | Lava Rápido{% endblock %}
{% block content %}
<div class="form-card card shadow-sm mx-auto"><div class="card-body p-4">
  <h1 class="h3 mb-3">{{ 'Editar' if cliente else 'Novo' }} cliente</h1>
  <form method="post">
    <div class="mb-3"><label class="form-label" for="nome">Nome</label><input class="form-control" id="nome" name="nome" value="{{ cliente['nome'] if cliente else '' }}" required></div>
    <div class="mb-3"><label class="form-label" for="telefone">Telefone</label><input class="form-control" id="telefone" name="telefone" value="{{ (cliente['telefone'] or '') if cliente else '' }}"></div>
    <div class="mb-3"><label class="form-label" for="email">E-mail</label><input class="form-control" type="email" id="email" name="email" value="{{ (cliente['email'] or '') if cliente else '' }}"></div>
    <button class="btn btn-primary" type="submit">Salvar</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('clientes.listar') }}">Cancelar</a>
  </form>
</div></div>
{% endblock %}
